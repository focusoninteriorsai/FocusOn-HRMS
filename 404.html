<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FOCUSON HRMS - Redirecting</title>
  <script>
    // GitHub Pages SPA redirect preserving path as hash
    const path = window.location.pathname;
    const search = window.location.search;
    const hash = window.location.hash;
    window.location.replace('./index.html' + (path && path !== '/' ? '#/' + path.replace(/^\//, '') : '') + (hash ? hash : ''));
  </script>
</head>
<body>
  <p>Redirecting to FOCUSON HRMS...</p>
</body>
</html>
